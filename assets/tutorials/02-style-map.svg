<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}</style><rect x="0" y="0" width="1800" height="1200" rx="0" fill="#F4F6FA" stroke="none" stroke-width="2"/><text x="72" y="75" font-size="24" fill="#526174" font-weight="650">ADU MOTION VIDEO   /   入门教程 02</text><text x="72" y="158" font-size="56" fill="#13233D" font-weight="750">先选画面语言，再选版式与动作</text><text x="72" y="218" font-size="28" fill="#65738A" font-weight="450">分类帮助沟通创作方向；具体镜头仍要按你的台词设计。</text><rect x="72" y="283" width="808" height="591" rx="24" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="2"/><rect x="920" y="283" width="808" height="591" rx="24" fill="#FFFDF8" stroke="#E9DEC8" stroke-width="2"/><rect x="100" y="314" width="58" height="48" rx="12" fill="#E3EAFF" stroke="none" stroke-width="2"/><text x="117" y="348" font-size="25" fill="#2462EA" font-weight="700">01</text><text x="181" y="353" font-size="40" fill="#172B4F" font-weight="750">现代图文动效</text><text x="100" y="404" font-size="28" fill="#67778F" font-weight="450">用人物、信息与版面组织观点</text><rect x="948" y="314" width="58" height="48" rx="12" fill="#F6E2B6" stroke="none" stroke-width="2"/><text x="965" y="348" font-size="25" fill="#96601B" font-weight="700">02</text><text x="1029" y="353" font-size="40" fill="#4D3824" font-weight="750">手绘卡通叙事</text><text x="948" y="404" font-size="28" fill="#89765F" font-weight="450">用角色反应与道具变化推动情节</text><rect x="100" y="452" width="226" height="181" rx="15" fill="#F3F6FC" stroke="none" stroke-width="2"/><rect x="118" y="472" width="77" height="143" rx="12" fill="#B7C9ED" stroke="none" stroke-width="2"/><rect x="208" y="481" width="101" height="44" rx="8" fill="#2462EA" stroke="none" stroke-width="2"/><rect x="208" y="539" width="101" height="63" rx="8" fill="#D7E2F7" stroke="none" stroke-width="2"/><text x="100" y="687" font-size="30" fill="#203756" font-weight="650">实拍卡片</text><text x="100" y="732" font-size="23" fill="#758197" font-weight="450">人物 + 资料卡</text><rect x="348" y="452" width="226" height="181" rx="15" fill="#F3F6FC" stroke="none" stroke-width="2"/><rect x="366" y="472" width="126" height="28" rx="6" fill="#2462EA" stroke="none" stroke-width="2"/><rect x="366" y="513" width="126" height="99" rx="7" fill="#C4D4F1" stroke="none" stroke-width="2"/><rect x="505" y="472" width="50" height="140" rx="7" fill="#DFE7F4" stroke="none" stroke-width="2"/><text x="348" y="687" font-size="30" fill="#203756" font-weight="650">编辑分栏</text><text x="348" y="732" font-size="23" fill="#758197" font-weight="450">主文 + 旁注</text><rect x="596" y="452" width="226" height="181" rx="15" fill="#F3F6FC" stroke="none" stroke-width="2"/><rect x="668" y="469" width="128" height="113" rx="9" fill="#DDE6F7" stroke="none" stroke-width="2"/><rect x="641" y="487" width="128" height="113" rx="9" fill="#A9C3EF" stroke="none" stroke-width="2"/><rect x="614" y="504" width="128" height="113" rx="9" fill="#2462EA" stroke="none" stroke-width="2"/><text x="596" y="687" font-size="30" fill="#203756" font-weight="650">纵深舞台</text><text x="596" y="732" font-size="23" fill="#758197" font-weight="450">前后层 + 推近</text><text x="100" y="818" font-size="26" fill="#516681" font-weight="450">常用素材：口播、录屏、截图、数字与图标</text><rect x="952" y="472" width="736" height="142" rx="18" fill="#F8F0E1" stroke="none" stroke-width="2"/><rect x="977" y="499" width="52" height="52" rx="26" fill="#E7C680" stroke="none" stroke-width="2"/><text x="993" y="536" font-size="27" fill="#604820" font-weight="700">A</text><text x="1051" y="519" font-size="32" fill="#5F462D" font-weight="700">角色与道具表演</text><text x="978" y="578" font-size="25" fill="#8B7255" font-weight="450">先准备动作，再发生变化，最后给出结果。</text><rect x="952" y="650" width="736" height="142" rx="18" fill="#F8F0E1" stroke="none" stroke-width="2"/><rect x="977" y="677" width="52" height="52" rx="26" fill="#E7C680" stroke="none" stroke-width="2"/><text x="993" y="714" font-size="27" fill="#604820" font-weight="700">B</text><text x="1051" y="697" font-size="32" fill="#5F462D" font-weight="700">同镜头续接</text><text x="978" y="756" font-size="25" fill="#8B7255" font-weight="450">沿着上一镜的位置、道具状态和情节继续演。</text><rect x="72" y="924" width="1656" height="184" rx="24" fill="#13233D" stroke="none" stroke-width="2"/><text x="108" y="978" font-size="34" fill="#FFFFFF" font-weight="700">动作工具箱：错峰入场  ·  连续形变  ·  关键词 / 节拍字效</text><text x="108" y="1033" font-size="26" fill="#CCDAEF" font-weight="450">这些手法可以组合使用，不再各自列成一个大风格。</text><text x="108" y="1078" font-size="25" fill="#AFC2DF" font-weight="450">另外选择：横屏 / 竖屏，标准字幕 / 英文加大；已有工程继续使用它的原引擎。</text></svg>