<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}</style><rect x="0" y="0" width="1800" height="1080" rx="0" fill="#F4F6FA" stroke="none" stroke-width="2"/><text x="72" y="75" font-size="24" fill="#526174" font-weight="650">ADU MOTION VIDEO   /   入门教程 01</text><text x="72" y="158" font-size="56" fill="#13233D" font-weight="750">你提供内容，AI 帮你完成可编辑视频</text><text x="72" y="218" font-size="28" fill="#65738A" font-weight="450">先在自己的电脑跑通演示，再接入口播素材。</text><rect x="72" y="292" width="354" height="430" rx="24" fill="#FFFFFF" stroke="#E0E5EF" stroke-width="2"/><rect x="97" y="321" width="58" height="49" rx="13" fill="#E3EAFF" stroke="none" stroke-width="2"/><text x="111" y="357" font-size="27" fill="#243758" font-weight="700">01</text><text x="97" y="424" font-size="36" fill="#13233D" font-weight="750">工具</text><text x="97" y="478" font-size="25" fill="#243758" font-weight="650">Codex 或 Claude Code</text><text x="97" y="548" font-size="22" fill="#647086" font-weight="450">能访问本地文件、执行命令</text><text x="97" y="595" font-size="22" fill="#647086" font-weight="450">Node.js · Python · FFmpeg</text><text x="97" y="642" font-size="22" fill="#647086" font-weight="450">Chrome / Chromium</text><path d="M443 508h54m-16-15 16 15-16 15" fill="none" stroke="#9BAABD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="514" y="292" width="354" height="430" rx="24" fill="#FFFFFF" stroke="#E0E5EF" stroke-width="2"/><rect x="539" y="321" width="58" height="49" rx="13" fill="#E3F0EA" stroke="none" stroke-width="2"/><text x="553" y="357" font-size="27" fill="#243758" font-weight="700">02</text><text x="539" y="424" font-size="36" fill="#13233D" font-weight="750">输入</text><text x="539" y="478" font-size="25" fill="#243758" font-weight="650">口播视频 + 对应文案</text><text x="539" y="548" font-size="22" fill="#647086" font-weight="450">建议附 SRT，减少校对</text><text x="539" y="595" font-size="22" fill="#647086" font-weight="450">录屏 / 图片 / Logo / 音乐</text><text x="539" y="642" font-size="22" fill="#647086" font-weight="450">改旧片时加上可编辑工程</text><path d="M885 508h54m-16-15 16 15-16 15" fill="none" stroke="#9BAABD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="956" y="292" width="354" height="430" rx="24" fill="#FFFFFF" stroke="#E0E5EF" stroke-width="2"/><rect x="981" y="321" width="58" height="49" rx="13" fill="#FCECCB" stroke="none" stroke-width="2"/><text x="995" y="357" font-size="27" fill="#243758" font-weight="700">03</text><text x="981" y="424" font-size="36" fill="#13233D" font-weight="750">制作</text><text x="981" y="478" font-size="25" fill="#243758" font-weight="650">检查 → 编排 → 预览</text><text x="981" y="548" font-size="22" fill="#647086" font-weight="450">先确认环境与素材完整</text><text x="981" y="595" font-size="22" fill="#647086" font-weight="450">设计动作，检查字幕和转场</text><text x="981" y="642" font-size="22" fill="#647086" font-weight="450">看短段，再导出完整成片</text><path d="M1327 508h54m-16-15 16 15-16 15" fill="none" stroke="#9BAABD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1398" y="292" width="330" height="430" rx="24" fill="#FFFFFF" stroke="#E0E5EF" stroke-width="2"/><rect x="1423" y="321" width="58" height="49" rx="13" fill="#EEE5FA" stroke="none" stroke-width="2"/><text x="1437" y="357" font-size="27" fill="#243758" font-weight="700">04</text><text x="1423" y="424" font-size="36" fill="#13233D" font-weight="750">输出</text><text x="1423" y="478" font-size="25" fill="#243758" font-weight="650">MP4 + 可编辑工程</text><text x="1423" y="548" font-size="22" fill="#647086" font-weight="450">关键画面预览</text><text x="1423" y="595" font-size="22" fill="#647086" font-weight="450">字幕 / 混音数据（如有）</text><text x="1423" y="642" font-size="22" fill="#647086" font-weight="450">帧数、时长与解码记录</text><rect x="72" y="782" width="1656" height="212" rx="24" fill="#13233D" stroke="none" stroke-width="2"/><text x="108" y="836" font-size="33" fill="#FFFFFF" font-weight="700">第一次使用？先不准备任何个人素材。</text><text x="108" y="895" font-size="30" fill="#D9E4FC" font-weight="450">安装 Skill  →  doctor 检查环境  →  setup 准备依赖  →  demo 导出示例</text><text x="108" y="950" font-size="24" fill="#AEC0DF" font-weight="450">只有文案可以先做静音样片；真人声音和口型需要你提供对应素材。</text></svg>