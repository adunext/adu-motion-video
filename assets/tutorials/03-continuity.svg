<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1430" viewBox="0 0 1800 1430"><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}</style><rect x="0" y="0" width="1800" height="1430" rx="0" fill="#F4F6FA" stroke="none" stroke-width="2"/><text x="72" y="75" font-size="24" fill="#526174" font-weight="650">ADU MOTION VIDEO   /   入门教程 03</text><text x="72" y="158" font-size="56" fill="#13233D" font-weight="750">同一个角色，沿着原来的动作继续演</text><text x="72" y="218" font-size="28" fill="#65738A" font-weight="450">以下是仓库内 8 秒手绘示例的真实关键帧，可下载源码并直接导出。</text><rect x="72" y="278" width="806" height="473" rx="24" fill="#FFFFFF" stroke="#DEE4EE" stroke-width="2"/><text x="96" y="322" font-size="30" fill="#182A46" font-weight="700">01  准备：保留原有位置</text><text x="748" y="320" font-size="23" fill="#6C7C91" font-weight="450">00.00s</text><image href="frames/continuity-1.png" x="95" y="345" width="760" height="350" preserveAspectRatio="xMidYMid meet"/><text x="96" y="722" font-size="25" fill="#576981" font-weight="450">先确定角色、双手、纸张和镜头的连续性。</text><rect x="922" y="278" width="806" height="473" rx="24" fill="#FFFFFF" stroke="#DEE4EE" stroke-width="2"/><text x="946" y="322" font-size="30" fill="#182A46" font-weight="700">02  收拢并攥紧</text><text x="1598" y="320" font-size="23" fill="#6C7C91" font-weight="450">04.40s</text><image href="frames/continuity-2.png" x="945" y="345" width="760" height="350" preserveAspectRatio="xMidYMid meet"/><text x="946" y="722" font-size="25" fill="#576981" font-weight="450">纸张沿路径汇到双手，让用力有过程。</text><rect x="72" y="781" width="806" height="473" rx="24" fill="#FFFFFF" stroke="#DEE4EE" stroke-width="2"/><text x="96" y="825" font-size="30" fill="#182A46" font-weight="700">03  成果弹出</text><text x="748" y="823" font-size="23" fill="#6C7C91" font-weight="450">05.30s</text><image href="frames/continuity-3.png" x="95" y="848" width="760" height="350" preserveAspectRatio="xMidYMid meet"/><text x="96" y="1225" font-size="25" fill="#576981" font-weight="450">变化从同一接触位置发生，避免突然换场。</text><rect x="922" y="781" width="806" height="473" rx="24" fill="#FFFFFF" stroke="#DEE4EE" stroke-width="2"/><text x="946" y="825" font-size="30" fill="#182A46" font-weight="700">04  收势与阅读</text><text x="1598" y="823" font-size="23" fill="#6C7C91" font-weight="450">07.50s</text><image href="frames/continuity-4.png" x="945" y="848" width="760" height="350" preserveAspectRatio="xMidYMid meet"/><text x="946" y="1225" font-size="25" fill="#576981" font-weight="450">卡片与表情依次停稳，再交给下一个镜头。</text><rect x="72" y="1320" width="1656" height="62" rx="14" fill="#172943" stroke="none" stroke-width="2"/><text x="104" y="1361" font-size="28" fill="#E1E9F7" font-weight="450">动作与笔触可复用；接上真实口播时，需重新设置时长、字幕和音效落点。</text></svg>