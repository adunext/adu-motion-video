<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
.cam{position:relative;border-radius:28px;overflow:hidden;background:#111;box-shadow:0 30px 70px rgba(0,0,0,.28)}
.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam.round{border-radius:50%;box-shadow:0 0 0 5px #fff,0 24px 50px rgba(0,0,0,.35)}
.cam.round img{object-position:50% 50%}
.cam .lab{position:absolute;left:18px;top:16px;font:400 19px ui-monospace,'PingFang SC',monospace;color:#fff;background:rgba(10,10,10,.5);padding:6px 14px;border-radius:30px;-webkit-backdrop-filter:blur(8px)}
.vt{position:relative;overflow:hidden;background:#000}
.vt img{width:100%;height:100%;object-fit:cover;display:block}
.glassD{background:rgba(20,20,20,.84);-webkit-backdrop-filter:blur(26px) saturate(1.4);border:1.5px solid rgba(255,255,255,.09);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:40px;font:600 24px -apple-system,'PingFang SC',sans-serif;white-space:nowrap}
.macwin{border-radius:16px;overflow:hidden;background:#1c1c1e;box-shadow:0 40px 100px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.macwin .tb{height:40px;display:flex;align-items:center;gap:9px;padding:0 16px;background:#2a2a2c;color:#d8d8d8;font:500 17px -apple-system,'PingFang SC'}
.macwin .tb i{width:13px;height:13px;border-radius:50%;display:block}
.macwin .body{position:relative;overflow:hidden}
.macwin .body img{width:100%;height:100%;display:block;object-fit:cover}
.lane{position:absolute;height:2px;background:rgba(255,255,255,.18)}
.check{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font:700 26px -apple-system}
</style>
<style>
html,body{width:1080px!important;height:1920px!important;background:#0A0A0A!important}
#vroot{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0A0A0A}
#vhead{position:absolute;left:60px;top:70px;width:960px}
#stage{position:absolute!important;left:0;top:300px;transform:scale(.5625);transform-origin:0 0}
#vtalk{position:absolute;left:0;top:908px;width:1080px;height:1012px;overflow:hidden;background:#111}
#vimg{position:absolute;left:0;top:0;width:1080px;height:1920px}
#vend{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;background:#0A0A0A}
#vend img{width:220px;height:220px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px #0A0A0A,0 0 0 10px #2462EA}
.cam{visibility:hidden!important}
#vroot>#ov .sz,#vroot>#ov .se{white-space:normal!important;max-width:980px;text-align:center}
#vroot>#ov .sz{font-size:50px!important}#vroot>#ov .se{font-size:30px!important}
</style></head><body>
<div id="vroot"><div id="vhead"><div class="mono" style="font-size:26px;color:#6d9bff;letter-spacing:3px">// 竖屏布局 · 示例品牌</div><div style="font:700 64px -apple-system,'PingFang SC';color:#fff;line-height:1.2;margin-top:14px">示例方案 A<br>展示新的方法</div></div><div id="vtalk"><img id="vimg"><div id="vend"><img src="assets/presenter.png"><div style="font:700 72px -apple-system,'PingFang SC';color:#fff;margin-top:26px">示例<span style="color:#6d9bff">品牌</span></div><div style="font:500 32px -apple-system,'PingFang SC';color:#aaa;margin-top:12px">创作与技术 · 示例品牌说明</div></div></div><div id="stage"><div id="world"></div><div id="fx"></div><div id="ov" style="position:absolute;inset:0;pointer-events:none"></div></div></div>
<script src="talkmap.js"></script>
<script src="wall.js"></script>
<script src="face.js"></script>
<script src="subs.js"></script>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script src="main.js"></script>
<script>
(() => {
  const root = $('vroot'), ov = $('ov'), img = $('vimg'), vend = $('vend');
  root.appendChild(ov); ov.style.cssText = 'position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none';
  const box = ov.firstChild; box.style.top = '1640px'; box.style.left = '50px'; box.style.right = '50px';
  const base = window.renderAt, H = 1012;
  window.renderAt = t => {
    base(t);
    setFrame(img, talkSrc(Math.min(t, 102.9)));
    const f = faceAt(Math.min(t, 102.9)), oy = clamp(H * .42 - f.cy * 1920, H - 1920, 0), ox = clamp(540 - f.cx * 1080, 0, 0);
    img.style.transform = `translate(${ox.toFixed(1)}px,${oy.toFixed(1)}px)`;
    const e = clamp((t - 102.95) / .4); vend.style.opacity = e; img.style.opacity = 1 - e;
  };
})();
</script>
</body></html>
